<style>

.wrap{background:#fff;border-radius:20px;overflow:hidden;max-width:780px;margin:0 auto;box-shadow:0 8px 48px rgba(11,29,58,0.14);}

.report-hero{padding:48px 48px 40px;border-bottom:1px solid rgba(11,29,58,0.07);background:linear-gradient(135deg,rgba(1,95,255,0.03) 0%,rgba(255,255,255,0) 60%);}
.hero-label{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#1FBFAB;margin-bottom:14px;display:flex;align-items:center;gap:7px;}

.hero-h1 em{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;color:#015FFF;}
.hero-p{font-size:14px;color:#5C6E84;line-height:1.68;max-width:500px;}
.hero-date{font-size:10px;color:#9AAABB;margin-top:18px;letter-spacing:.04em;}
.leaks-section{padding:36px 48px;border-bottom:1px solid rgba(11,29,58,0.06);}
.section-label{font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#9AAABB;margin-bottom:20px;display:flex;align-items:center;gap:8px;}
.section-label::after{content:'';flex:1;height:1px;background:rgba(11,29,58,0.07);display:block;}
.leak-card{border-radius:14px;padding:24px 28px;margin-bottom:14px;position:relative;overflow:hidden;border:1px solid rgba(11,29,58,0.08);}
.leak-card-bar{position:absolute;top:0;left:0;right:0;height:3px;}
.leak-num{font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;margin-bottom:8px;}
.leak-title{font-size:18px;font-weight:700;line-height:1.25;letter-spacing:-.02em;margin-bottom:8px;}
.leak-body{font-size:13px;color:#5C6E84;line-height:1.68;margin-bottom:16px;}
.leak-body p{margin-bottom:8px;}.leak-body p:last-child{margin-bottom:0;}
.cost-box{border-radius:9px;padding:14px 16px;margin-bottom:16px;}
.cost-label{font-size:8.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;}
.cost-list{list-style:none;}
.cost-item{font-size:12px;color:#5C6E84;line-height:1.5;padding-left:16px;position:relative;margin-bottom:6px;list-style:none;}
.cost-item::before{content:'';position:absolute;left:0;top:6px;width:5px;height:5px;border-radius:50%;display:block;}
.actions-label{font-size:8.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#9AAABB;margin-bottom:10px;margin-top:16px;}
.action-row{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px;}
.action-num{width:20px;height:20px;min-width:20px;border-radius:50%;color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.action-text{font-size:12.5px;color:#5C6E84;line-height:1.58;}
.play-box{border-radius:9px;padding:14px 16px;margin-top:16px;}
.play-label{font-size:8.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px;}
.play-title{font-size:14px;font-weight:700;letter-spacing:-.015em;margin-bottom:6px;color:#0B1D3A;}
.play-desc{font-size:12px;color:#5C6E84;line-height:1.62;}
.play-desc p{margin-bottom:6px;}.play-desc p:last-child{margin-bottom:0;}
.sprint-section{padding:36px 48px;background:linear-gradient(135deg,rgba(1,95,255,0.04) 0%,rgba(31,191,171,0.03) 100%);position:relative;}
.sprint-bar{position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#FF68E9,#FF9F45,#FFE04B,#7FE7C1,#0CC2FF,#8C78FF,#015FFF);}
.sprint-label{font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#1FBFAB;margin-bottom:10px;}
.sprint-h2{font-size:22px;font-weight:700;color:#0B1D3A;letter-spacing:-.02em;margin-bottom:10px;}
.sprint-p{font-size:13px;color:#5C6E84;line-height:1.68;margin-bottom:20px;max-width:480px;}
.sprint-btn{display:inline-flex;align-items:center;gap:8px;background:#015FFF;color:#fff;border-radius:9px;padding:11px 22px;font-size:12px;font-weight:600;text-decoration:none;}
.sprint-stats{display:flex;margin-top:24px;border:1px solid rgba(11,29,58,0.08);border-radius:12px;overflow:hidden;background:#fff;}
.stat{flex:1;min-width:0;padding:20px 12px;text-align:center;}
.stat-val{font-size:16px;font-weight:700;color:#0B1D3A;margin-bottom:4px;}
.stat-label{font-size:9px;color:#9AAABB;letter-spacing:.05em;text-transform:uppercase;word-break:break-word;}
.stat-mid{border-left:1px solid rgba(11,29,58,0.06);border-right:1px solid rgba(11,29,58,0.06);}
.report-footer{background:#fff;height:90px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid rgba(11,29,58,0.06);position:relative;overflow:hidden;}

<script>
const patterns={
P01:{subhead:"Two leaks found in your paid setup",leak1Title:"Audience quality is costing you on every media dollar",leak1Body:"<p>Paid social platforms build lookalike audiences from what they can see. What they can't see is who actually bought, came back twice, and spent above AOV. That data lives in your systems.</p><p>The result is a lookalike audience optimized for people who kind of resemble your average customer instead of your best one.</p>",leak1CostBullets:["Lookalike audiences built on platform signals underperform first-party–based seeds by 30–40% on match quality.","At current CPMs, that inefficiency shows up directly as higher CAC."],leak1Actions:["Pull your top 10% of customers by LTV. Is that profile what your ad platforms receive as a seed?","Time how long it takes a conversion event to suppress a customer across every ad platform.","Map how many platforms are running campaigns right now and how many of them get the same audience definition. TL;DR: If the answer is none or inconsistent, every platform is building its own version of who your best customers are."],leak1Play:"Lookalike Audience Expansion",leak1PlayDesc:"<p>Lookalike Audience Expansion scores your full customer base against behavioral, transactional, and declared data to build a high-precision seed audience. Then, it pushes to every ad platform.</p><p>When conversions come in, the model retrains. Customers are suppressed automatically across every channel the moment a purchase hits their profile.</p>",leak2Title:"Cart recovery timing is leaving recoverable revenue behind",leak2Body:"<p>A shopper adds to cart. Browses a few more pages. Leaves. The recovery sequence starts whenever a batch job runs. By then, the window where an on-site intervention could have closed the sale is gone.</p><p>If every channel manages its own recovery logic, a customer who converted on Tuesday is still seeing recovery ads on Wednesday.</p>",leak2CostBullets:["70% of online carts are abandoned, and timing is one of the most controllable drivers.","Real-time, cross-channel recovery outperforms delayed, single-channel approaches.","The first 30 minutes are the highest-conversion window; most systems miss it."],leak2Actions:["Time the gap between a cart abandonment event and your first recovery touchpoint. If it's longer than 30 minutes, the highest-conversion window is gone.","Check if your recovery sequence can intervene on-site before a shopper leaves. If the answer is no, anonymous high-intent visitors leave without a recovery play.","Map what happens across channels at the moment of purchase. If each platform manages its own suppression list, customers receive recovery messages even after they've already checked out."],leak2Play:"Abandoned Cart Recovery",leak2PlayDesc:"<p>Abandoned Cart Recovery detects abandonment the moment a session ends without an order and determines the right intervention.</p><p>The autonomous decisioning figures out whether an incentive is actually needed or whether a reminder is enough. When a purchase happens, suppression fires across every channel simultaneously.</p>"},
P02:{subhead:"Two leaks found across your paid social strategy and audience data",leak1Title:"Stale audience data is working against paid performance",leak1Body:"<p>Uploading customer lists to ad platforms is a stronger starting point than relying purely on platform signals. The problem is a CRM upload is a snapshot. The moment that file goes stale, platforms optimize for a version of your customer that no longer exists.</p>",leak1CostBullets:["Audience lists decay fast. Buying patterns shift. Match quality erodes with every week that passes without a refresh.","At current CPMs, stale seeds mean you're paying more to reach people who look less and less like your highest-value customers."],leak1Actions:["Check when your ad platforms last received a refreshed customer list. If it's been more than 30 days, the seed driving your lookalikes has drifted.","Pull your highest-LTV customers from the last 90 days. Compare that list to what's currently seeding your platforms. The gap between those two lists is your Leak 01 cost.","Map how many manual steps it takes to get a refreshed audience from your CRM into every platform simultaneously. If the answer involves exports, uploads, and someone's calendar, the refresh cadence will always lag."],leak1Play:"Lookalike Audience Expansion",leak1PlayDesc:"<p>Lookalike Audience Expansion scores your full customer base against behavioral, transactional, and declared data to build a high-precision seed audience, then pushes it to every ad platform simultaneously. No manual exports. No stale lists.</p><p>When conversions come in, the model retrains. Customers are suppressed automatically across every channel the moment a purchase hits their profile.</p>",leak2Title:"Cart recovery timing is costing you recoverable revenue",leak2Body:"<p>A shopper adds to cart. Browses a few more pages. Leaves. The recovery sequence starts whenever the batch job runs. By then, the window where an on-site intervention could have closed the sale is gone.</p><p>If every channel manages its own recovery logic, a customer who converted on Tuesday is still seeing recovery ads on Wednesday.</p>",leak2CostBullets:["70% of online carts are abandoned, and timing is one of the most controllable drivers.","Real-time cross-channel recovery consistently outperforms delayed single-channel approaches.","The first 30 minutes are the highest-conversion window. Most systems miss it."],leak2Actions:["Time the gap between a cart abandonment event and your first recovery touchpoint. If it's longer than 30 minutes, the highest-conversion window is gone.","Check if your recovery sequence can intervene on-site before a shopper leaves. If the answer is no, anonymous high-intent visitors leave without a recovery play.","Map what happens across channels the moment a purchase occurs. If each platform manages its own suppression list, customers receive recovery messages after they've already checked out."],leak2Play:"Abandoned Cart Recovery",leak2PlayDesc:"<p>Abandoned Cart Recovery detects abandonment the moment a session ends without an order and determines the right intervention.</p><p>Autonomous decisioning figures out whether an incentive is actually needed or whether a reminder is enough. When a purchase happens, suppression fires across every channel simultaneously.</p>"},
P03:{subhead:"Two leaks found across your paid media strategy and first-purchase conversion",leak1Title:"Platform-controlled targeting is leaving money behind on every campaign",leak1Body:"<p>Every targeting decision is the platform's call. With no custom audiences in place, ad platforms make decisions from their own behavioral signals. No first-party customer data, purchase history, or declared preferences are powering your campaigns.</p>",leak1CostBullets:["First-party data has no path into your ad platforms. Targeting accuracy is capped by what the platform can see.","Spend efficiency has a ceiling you can't move from inside the platform."],leak1Actions:["Pull your highest-LTV customers from the last 90 days. Check whether anything resembling that profile is informing your current targeting.","Compare CVR across campaigns where you have input on audience definition vs. campaigns running on platform-managed targeting. The gap is your Leak 01 cost.","Map what first-party data exists in your systems right now and identify what it would take to get that into your ad platforms."],leak1Play:"Lookalike Audience Expansion",leak1PlayDesc:"<p>Lookalike Audience Expansion scores your full customer base against behavioral, transactional, and declared data to build a high-precision seed audience, then pushes it to every ad platform simultaneously. No manual exports. No stale lists.</p><p>When conversions come in, the model retrains. Customers are suppressed automatically across every channel the moment a purchase hits their profile.</p>",leak2Title:"High-intent visitors are leaving money behind on every session",leak2Body:"<p>Traffic is coming in. A portion of it is genuinely close to converting. But nothing's triggering an intervention while they're still there. The session ends. They leave. No recovery play follows them.</p><p>Most commerce sites convert 2-4% of visitors. The other 96-98% leave without purchasing. Some of them were never going to buy. Some of them were literally right there.</p>",leak2CostBullets:["Engaged pre-purchase visitors are among the highest-margin conversion opportunities in the funnel.","A recovery play that only works on identified customers has already written off everyone who hasn't given you an email address."],leak2Actions:["Pull site sessions from the last 30 days and filter for visitors with three or more product page views who didn't convert. That's your highest-priority unconverted segment.","Check what recovery plays are currently active for anonymous visitors. TL;DR: If the answer is nothing, that segment leaves with no intervention behind them.","Map the average time between a visitor's first high-intent signal and your first recovery touchpoint. If recovery only starts after email capture, the in-session window is gone."],leak2Play:"First-Purchase Acceleration",leak2PlayDesc:"<p>First-Purchase Acceleration identifies high-engagement pre-purchase visitors in real time and delivers the right intervention during the session without requiring an email address. The decisioning evaluates which intervention actually fits.</p><p>When a visitor converts, their full pre-purchase behavioral history merges into their identified profile immediately.</p>"},
P04:{subhead:"Two leaks found across your paid media strategy and cart recovery",leak1Title:"Fragmented audience data is working against paid performance",leak1Body:"<p>A mix of audience approaches sounds like coverage. In practice, each platform works from a different version of who your best customers are. Meta has one read. Google has another. None of them reflect the same understanding of who's actually worth acquiring.</p><p>The result is inconsistent performance across channels and no clean way to diagnose what's working.</p>",leak1CostBullets:["15-30% of retargeting spend typically goes to low-intent audiences or customers who've already converted.","When every platform optimizes for a different audience definition, you can't isolate what's actually working or fix what isn't."],leak1Actions:["Pull your current audience definitions across every active paid channel. Check how many of them share the same source data.","Compare CAC across channels running coordinated audience definitions versus channels running independently. That gap is your Leak 01 cost.","Map what it would take to push one consistent audience definition to every platform simultaneously."],leak1Play:"Intent-Based Targeting",leak1PlayDesc:"<p>Intent-Based Targeting builds a unified intent score from behavior across the full customer profile and activates the highest-intent audiences across every paid channel simultaneously.</p><p>Converted customers get suppressed the moment a purchase hits their profile. Every channel updates at once.</p>",leak2Title:"Cart recovery timing is costing you recoverable revenue",leak2Body:"<p>A shopper adds to cart. Browses a few more pages. Leaves. The recovery sequence starts whenever the batch job runs. By then, the window where an on-site intervention could have closed the sale is gone.</p><p>If every channel manages its own recovery logic, a customer who converted on Tuesday is still seeing recovery ads on Wednesday.</p>",leak2CostBullets:["70% of online carts are abandoned, and timing is one of the most controllable drivers.","Real-time cross-channel recovery consistently outperforms delayed single-channel approaches.","The first 30 minutes are the highest-conversion window. Most systems miss it."],leak2Actions:["Time the gap between a cart abandonment event and your first recovery touchpoint. If it's longer than 30 minutes, the highest-conversion window is gone.","Check if your recovery sequence can intervene on-site before a shopper leaves. If the answer is no, anonymous high-intent visitors leave without a recovery play.","Map what happens across channels the moment a purchase occurs. If each platform manages its own suppression list, customers receive recovery messages after they've already checked out."],leak2Play:"Abandoned Cart Recovery",leak2PlayDesc:"<p>Abandoned Cart Recovery detects abandonment the moment a session ends without an order and determines the right intervention.</p><p>Autonomous decisioning figures out whether an incentive is actually needed or whether a reminder is enough. When a purchase happens, suppression fires across every channel simultaneously.</p>"},
P05:{subhead:"Two leaks found across your paid search strategy and audience quality",leak1Title:"Audience seed quality is costing you on every search campaign",leak1Body:"<p>Paid search captures high-intent demand from people already looking for what you sell. That's a strong starting point. But what happens when those visitors get added to lookalike audiences? The platform builds from its own signals instead of from who actually bought, came back, and spent above AOV.</p><p>The result is a lookalike audience optimized toward people who search like your average customer. Not your best one.</p>",leak1CostBullets:["Lookalike audiences built on platform signals underperform first-party-based seeds by 30-40% on match quality.","At current CPMs, that inefficiency shows up directly as higher CAC."],leak1Actions:["Pull your top 10% of customers by LTV. Is that profile what your ad platforms receive as a seed?","Time how long it takes a conversion event to suppress a customer across every ad platform.","Map how many platforms are running campaigns right now and how many get the same audience definition. If the answer is none or inconsistent, every platform is building its own version of who your best customers are."],leak1Play:"Lookalike Audience Expansion",leak1PlayDesc:"<p>Lookalike Audience Expansion scores your full customer base against behavioral, transactional, and declared data to build a high-precision seed audience, then pushes it to every ad platform simultaneously. No manual exports. No stale lists.</p><p>When conversions come in, the model retrains. Customers are suppressed automatically across every channel the moment a purchase hits their profile.</p>",leak2Title:"Cart recovery timing is leaving recoverable revenue behind",leak2Body:"<p>A shopper adds to cart. Browses a few more pages. Leaves. The recovery sequence starts whenever the batch job runs. By then, the window where an on-site intervention could have closed the sale is gone.</p><p>If every channel manages its own recovery logic, a customer who converted on Tuesday is still seeing recovery ads on Wednesday.</p>",leak2CostBullets:["70% of online carts are abandoned, and timing is one of the most controllable drivers.","Real-time cross-channel recovery consistently outperforms delayed single-channel approaches.","The first 30 minutes are the highest-conversion window. Most systems miss it."],leak2Actions:["Time the gap between a cart abandonment event and your first recovery touchpoint. If it's longer than 30 minutes, the highest-conversion window is gone.","Check if your recovery sequence can intervene on-site before a shopper leaves. If the answer is no, anonymous high-intent visitors leave without a recovery play.","Map what happens across channels the moment a purchase occurs. If each platform manages its own suppression list, customers receive recovery messages after they've already checked out."],leak2Play:"Abandoned Cart Recovery",leak2PlayDesc:"<p>Abandoned Cart Recovery detects abandonment the moment a session ends without an order and determines the right intervention.</p><p>Autonomous decisioning figures out whether an incentive is actually needed or whether a reminder is enough. When a purchase happens, suppression fires across every channel simultaneously.</p>"},
P06:{subhead:"Two leaks found across your paid search strategy and audience data",leak1Title:"Stale audience data is working against search spend",leak1Body:"<p>Uploading customer lists to ad platforms is a stronger starting point than relying purely on platform signals. The problem is a CRM upload is a snapshot. The moment that file goes stale, platforms optimize for a version of your customer that no longer exists. New purchase behavior, updated LTV signals, recent engagement patterns. None of it makes it in until someone re-exports.</p><p>The platform keeps optimizing. Just not toward your actual best customers anymore.</p>",leak1CostBullets:["26% of digital ad spend is wasted due to poor targeting and data quality. Stale audience data is a direct contributor.","At $400k in monthly spend, that's $104k in waste per month — before accounting for the CAC impact of optimizing toward the wrong customers."],leak1Actions:["Check when your ad platforms last received a refreshed customer list. If it's been more than 30 days, the seed driving your lookalikes has drifted.","Pull your highest-LTV customers from the last 90 days. Compare that list to what's currently seeding your platforms. The gap between those two lists is your Leak 01 cost.","Map how many manual steps it takes to get a refreshed audience from your CRM into every platform simultaneously. If the answer involves exports, uploads, and someone's calendar, the refresh cadence will always lag."],leak1Play:"Lookalike Audience Expansion",leak1PlayDesc:"<p>Lookalike Audience Expansion scores your full customer base against behavioral, transactional, and declared data to build a high-precision seed audience, then pushes it to every ad platform simultaneously. No manual exports. No stale lists.</p><p>When conversions come in, the model retrains. Customers are suppressed automatically across every channel the moment a purchase hits their profile.</p>",leak2Title:"Cart recovery timing is costing you recoverable revenue",leak2Body:"<p>A shopper adds to cart. Browses a few more pages. Leaves. The recovery sequence starts whenever the batch job runs. By then, the window where an on-site intervention could have closed the sale is gone.</p><p>If every channel manages its own recovery logic, a customer who converted on Tuesday is still seeing recovery ads on Wednesday.</p>",leak2CostBullets:["70% of online carts are abandoned, and timing is one of the most controllable drivers.","Real-time cross-channel recovery consistently outperforms delayed single-channel approaches.","The first 30 minutes are the highest-conversion window. Most systems miss it."],leak2Actions:["Time the gap between a cart abandonment event and your first recovery touchpoint. If it's longer than 30 minutes, the highest-conversion window is gone.","Check if your recovery sequence can intervene on-site before a shopper leaves. If the answer is no, anonymous high-intent visitors leave without a recovery play.","Map what happens across channels the moment a purchase occurs. If each platform manages its own suppression list, customers receive recovery messages after they've already checked out."],leak2Play:"Abandoned Cart Recovery",leak2PlayDesc:"<p>Abandoned Cart Recovery detects abandonment the moment a session ends without an order and determines the right intervention.</p><p>Autonomous decisioning figures out whether an incentive is actually needed or whether a reminder is enough. When a purchase happens, suppression fires across every channel simultaneously.</p>"},
P07:{subhead:"Two leaks found across your programmatic spend and cart recovery",leak1Title:"Disconnected audience signals are working against programmatic spend",leak1Body:"<p>Programmatic buying environments bid against whoever has the best audience definition. Right now, the definition feeding your campaigns is built from platform signals alone. On-site behavior, email engagement, loyalty status, purchase history — none of that is actually informing who gets targeted or suppressed.</p><p>Every platform sees a fragment of your customer. None of them see the full picture. In an environment where the bid goes to whoever has the strongest audience intelligence, that gap has a direct cost.</p>",leak1CostBullets:["The ANA's programmatic benchmark reported $26.8B in unrealized media value industry-wide. Weak audience definitions are a primary driver.","15-30% of retargeting spend typically goes to low-intent audiences or customers who've already converted. In programmatic environments where spend scales fast, that waste scales with it."],leak1Actions:["Pull the audience definitions currently feeding your programmatic campaigns. Check how many are built from first-party behavioral and transactional data versus platform-managed signals. The gap is your Leak 01 cost.","Check whether converted customers are being suppressed across your programmatic DSP in real time. If suppression runs on a batch schedule, you're paying to reach people who already bought.","Map what signals are available in your own systems and identify what it would take to get those into your programmatic targeting."],leak1Play:"Intent-Based Targeting",leak1PlayDesc:"<p>Intent-Based Targeting builds a unified intent score from behavior across the full customer profile and activates the highest-intent audiences across every paid channel simultaneously.</p><p>Converted customers get suppressed the moment a purchase hits their profile. Every channel updates at once.</p>",leak2Title:"Cart recovery timing is leaving recoverable revenue behind",leak2Body:"<p>A shopper adds to cart. Browses a few more pages. Leaves. The recovery sequence starts whenever the batch job runs. By then, the window where an on-site intervention could have closed the sale is gone.</p><p>If every channel manages its own recovery logic, a customer who converted on Tuesday is still seeing recovery ads on Wednesday.</p>",leak2CostBullets:["70% of online carts are abandoned, and timing is one of the most controllable drivers.","Real-time cross-channel recovery consistently outperforms delayed single-channel approaches.","The first 30 minutes are the highest-conversion window. Most systems miss it."],leak2Actions:["Time the gap between a cart abandonment event and your first recovery touchpoint. If it's longer than 30 minutes, the highest-conversion window is gone.","Check if your recovery sequence can intervene on-site before a shopper leaves. If the answer is no, anonymous high-intent visitors leave without a recovery play.","Map what happens across channels the moment a purchase occurs. If each platform manages its own suppression list, customers receive recovery messages after they've already checked out."],leak2Play:"Abandoned Cart Recovery",leak2PlayDesc:"<p>Abandoned Cart Recovery detects abandonment the moment a session ends without an order and determines the right intervention.</p><p>Autonomous decisioning figures out whether an incentive is actually needed or whether a reminder is enough. When a purchase happens, suppression fires across every channel simultaneously.</p>"},
P08:{subhead:"Two leaks found across your media spend and retargeting strategy",leak1Title:"Siloed audience data is leaving money behind across every channel",leak1Body:"<p>Heavy investment in retail media means reaching shoppers inside environments where the platform owns the audience data. You can target. You can optimize. What you can't do is take what you learn and use it anywhere else. The intelligence stays inside the retailer's walls.</p><p>Meanwhile, every other channel is building its own version of who your best customers are from its own incomplete signals. First-party customer intelligence, sitting in your own systems, powers none of it.</p>",leak1CostBullets:["26% of digital ad spend is wasted due to poor targeting and data quality. Siloed audience intelligence across channels is a direct contributor.","At $400k in monthly spend, that's $104k in waste per month before accounting for the compounding cost of every platform optimizing toward a different customer profile."],leak1Actions:["Map every active paid channel and identify which ones are receiving first-party audience data from your own systems.","Check whether the same high-value customer definition is feeding your retail media campaigns and your other paid channels simultaneously. If each channel has a different definition, you're not running a coordinated strategy.","Pull CAC by channel for the last 90 days. If performance varies significantly across channels running similar objectives, fragmented audience intelligence is likely a contributing factor."],leak1Play:"Lookalike Audience Expansion",leak1PlayDesc:"<p>Lookalike Audience Expansion scores your full customer base against behavioral, transactional, and declared data to build a high-precision seed audience, then pushes it to every ad platform simultaneously. No manual exports. No stale lists.</p><p>When conversions come in, the model retrains. Customers are suppressed automatically across every channel the moment a purchase hits their profile.</p>",leak2Title:"Suppression gaps are costing you on already-converted customers",leak2Body:"<p>When paid social, retail media, programmatic, and search all operate independently, there's no unified view of what a given customer has already done. Someone converts on your site. Meta doesn't know yet. Your DSP doesn't know yet. Your retail media network definitely doesn't know yet. The ads keep running.</p><p>Channel siloing drives campaigns that actively work against each other.</p>",leak2CostBullets:["15-30% of retargeting spend typically goes to low-intent audiences or customers who've already converted.","At $250k in monthly retargeting spend, that's up to $75k wasted every month on people who already bought."],leak2Actions:["Check how long it takes a purchase event to suppress a customer across every active paid channel. If the answer varies by channel or exceeds 24 hours anywhere, converted customers are still in your retargeting pool.","Pull the overlap between your retargeting audiences and your recent purchaser list. If recently converted customers appear in both, suppression gaps are costing you.","Map how many separate suppression lists exist across your paid channels and how each one gets updated. If the answer involves manual exports or platform-specific processes, real-time suppression isn't happening."],leak2Play:"Intent-Based Targeting",leak2PlayDesc:"<p>Intent-Based Targeting builds a unified intent score from behavior across the full customer profile and activates the highest-intent audiences across every paid channel simultaneously.</p><p>Converted customers get suppressed the moment a purchase hits their profile. Every channel updates at once.</p>"},
P09:{subhead:"Two leaks found across your paid media strategy and cart recovery",leak1Title:"Audience seed quality is costing you across every platform",leak1Body:"<p>Spending across a mix of channels with platform-native audiences means every platform is building its own version of who your best customers are. Meta has one read. Google has another. None of them are working from your actual customer intelligence. They're working from whatever signals they can see inside their own walls.</p><p>The result is inconsistent performance across channels with no clean way to diagnose what's actually working.</p>",leak1CostBullets:["Lookalike audiences built on platform signals underperform first-party based seeds by 30-40% on match quality.","26% of digital ad spend is wasted due to poor targeting and data quality. Running platform-native audiences across multiple channels compounds that waste across every campaign simultaneously."],leak1Actions:["Pull your top 10% of customers by LTV. Is that profile what your ad platforms receive as a seed?","Time how long it takes a conversion event to suppress a customer across every active paid channel simultaneously. If the answer varies by platform, every channel is running on a different schedule.","Map how many platforms are running campaigns right now and how many get the same audience definition. If the answer is none or inconsistent, every platform is building its own version of who your best customers are."],leak1Play:"Lookalike Audience Expansion",leak1PlayDesc:"<p>Lookalike Audience Expansion scores your full customer base against behavioral, transactional, and declared data to build a high-precision seed audience, then pushes it to every ad platform simultaneously. No manual exports. No stale lists.</p><p>When conversions come in, the model retrains. Customers are suppressed automatically across every channel the moment a purchase hits their profile.</p>",leak2Title:"Cart recovery timing is leaving recoverable revenue behind",leak2Body:"<p>A shopper adds to cart. Browses a few more pages. Leaves. The recovery sequence starts whenever the batch job runs. By then, the window where an on-site intervention could have closed the sale is gone.</p><p>If every channel manages its own recovery logic, a customer who converted on Tuesday is still seeing recovery ads on Wednesday.</p>",leak2CostBullets:["70% of online carts are abandoned, and timing is one of the most controllable drivers.","Real-time cross-channel recovery consistently outperforms delayed single-channel approaches.","The first 30 minutes are the highest-conversion window. Most systems miss it."],leak2Actions:["Time the gap between a cart abandonment event and your first recovery touchpoint. If it's longer than 30 minutes, the highest-conversion window is gone.","Check if your recovery sequence can intervene on-site before a shopper leaves. If the answer is no, anonymous high-intent visitors leave without a recovery play.","Map what happens across channels the moment a purchase occurs. If each platform manages its own suppression list, customers receive recovery messages after they've already checked out."],leak2Play:"Abandoned Cart Recovery",leak2PlayDesc:"<p>Abandoned Cart Recovery detects abandonment the moment a session ends without an order and determines the right intervention.</p><p>Autonomous decisioning figures out whether an incentive is actually needed or whether a reminder is enough. When a purchase happens, suppression fires across every channel simultaneously.</p>"},
P10:{subhead:"Two leaks found across your paid media strategy and cart recovery",leak1Title:"Fragmented audience data is working against paid performance",leak1Body:"<p>A mix of channels with a mix of audience approaches sounds like coverage. In practice, each platform is working from a different version of who your best customers are. Some channels get CRM uploads. Some get whatever the platform decides. None of them are working from the same signal at the same time.</p><p>You're not running a coordinated audience strategy. You're running several disconnected ones and hoping the aggregate works out.</p>",leak1CostBullets:["26% of digital ad spend is wasted due to poor targeting and data quality. Fragmented audience definitions across channels are a direct contributor.","When every platform optimizes for a different audience definition, you can't isolate what's actually working or fix what isn't."],leak1Actions:["Pull your current audience definitions across every active paid channel. Check how many share the same source data.","Compare CAC across channels running coordinated audience definitions versus channels running independently. That gap is your Leak 01 cost.","Map what it would take to push one consistent high-value audience definition to every platform simultaneously. If the answer involves separate uploads, separate logins, and separate schedules, fragmentation will persist."],leak1Play:"Intent-Based Targeting",leak1PlayDesc:"<p>Intent-Based Targeting builds a unified intent score from behavior across the full customer profile and activates the highest-intent audiences across every paid channel simultaneously.</p><p>Converted customers get suppressed the moment a purchase hits their profile. Every channel updates at once.</p>",leak2Title:"Cart recovery timing is costing you recoverable revenue",leak2Body:"<p>A shopper adds to cart. Browses a few more pages. Leaves. The recovery sequence starts whenever the batch job runs. By then, the window where an on-site intervention could have closed the sale is gone.</p><p>If every channel manages its own recovery logic, a customer who converted on Tuesday is still seeing recovery ads on Wednesday.</p>",leak2CostBullets:["70% of online carts are abandoned, and timing is one of the most controllable drivers.","Real-time cross-channel recovery consistently outperforms delayed single-channel approaches.","The first 30 minutes are the highest-conversion window. Most systems miss it."],leak2Actions:["Time the gap between a cart abandonment event and your first recovery touchpoint. If it's longer than 30 minutes, the highest-conversion window is gone.","Check if your recovery sequence can intervene on-site before a shopper leaves. If the answer is no, anonymous high-intent visitors leave without a recovery play.","Map what happens across channels the moment a purchase occurs. If each platform manages its own suppression list, customers receive recovery messages after they've already checked out."],leak2Play:"Abandoned Cart Recovery",leak2PlayDesc:"<p>Abandoned Cart Recovery detects abandonment the moment a session ends without an order and determines the right intervention.</p><p>Autonomous decisioning figures out whether an incentive is actually needed or whether a reminder is enough. When a purchase happens, suppression fires across every channel simultaneously.</p>"},
P11:{subhead:"Two leaks found across your paid media strategy and first-purchase conversion",leak1Title:"Ad spend is leaving money behind before the first purchase",leak1Body:"<p>Spending across a mix of channels with no custom audience strategy means every platform makes every targeting decision from its own data. There's no first-party intelligence informing who sees your ads, no unified definition of who your best customers are, and no consistent signal flowing across channels simultaneously.</p><p>Every platform is guessing independently. And you're funding all of them.</p>",leak1CostBullets:["26% of digital ad spend is wasted due to poor targeting and data quality. With no custom audiences in place, that waste runs across every channel simultaneously.","At $400k in monthly spend, that's $104k in waste per month before accounting for the compounding cost of every platform optimizing toward a different customer profile."],leak1Actions:["Pull your highest-LTV customers from the last 90 days. Check whether anything resembling that profile is informing your current targeting across any active channel.","Compare CVR across any campaigns where you've had input on audience definition versus campaigns running on fully platform-managed targeting. That gap is your cost.","Map what first-party data exists in your systems right now and identify what it would take to get it into your ad platforms consistently. If the answer involves multiple teams and a project timeline, the gap will stay open."],leak1Play:"Lookalike Audience Expansion",leak1PlayDesc:"<p>Lookalike Audience Expansion scores your full customer base against behavioral, transactional, and declared data to build a high-precision seed audience, then pushes it to every ad platform simultaneously. No manual exports. No stale lists.</p><p>When conversions come in, the model retrains. Customers are suppressed automatically across every channel the moment a purchase hits their profile.</p>",leak2Title:"High-intent visitors are costing you on every unconverted session",leak2Body:"<p>Traffic is coming in across multiple channels. Some of it is genuinely close to converting. But there's no recovery play waiting for them. The session ends. They leave. Nothing follows them.</p><p>With no systematic recovery in place, every high-intent visitor who doesn't convert on the first visit is a sunk acquisition cost with no second chance built in.</p>",leak2CostBullets:["Most commerce sites convert 2-4% of visitors. The other 96-98% leave without purchasing.","Engaged pre-purchase visitors are among the highest-margin conversion opportunities in the funnel. Right now, they're leaving without a play."],leak2Actions:["Pull site sessions from the last 30 days and filter for visitors with three or more product page views who didn't convert. That's your highest-priority unconverted segment.","Check what recovery plays are currently active for anonymous visitors who haven't identified themselves. If the answer is nothing, that entire segment leaves with no intervention behind them.","Map the average time between a visitor's first high-intent signal and your first recovery touchpoint. If recovery only starts after email capture, the in-session window is gone before anything fires."],leak2Play:"First-Purchase Acceleration",leak2PlayDesc:"<p>First-Purchase Acceleration identifies high-engagement pre-purchase visitors in real time and delivers the right intervention during the session without requiring an email address. The decisioning evaluates which intervention fits.</p><p>When a visitor converts, their full pre-purchase behavioral history merges into their identified profile immediately.</p>"},
P12:{subhead:"Two potential opportunities found across your checkout experience and repeat purchase strategy",leak1Title:"Checkout revenue potential may be leaving money behind every session",leak1Body:"<p>Your acquisition foundation is solid. Traffic is converting, recovery is coordinated, and audiences are informed. The next performance gap shows up inside the transaction itself. Shoppers are converting, but the value of each session isn't being fully captured.</p><p>A first-time buyer and a loyal returning customer aren't the same shopper, but they're often seeing the same recommendations. Generic cross-sell logic leaves in-session revenue on the table every time a cart closes.</p>",leak1CostBullets:["Industry studies show single-item orders represent 60-70% of ecommerce transactions.","At 50k monthly orders and an $80 AOV, if just 10% of single-item orders added a $20 complementary product that's $65k in additional monthly revenue sitting inside sessions that are already converting."],leak1Actions:["Pull your single-item order rate for the last 90 days. If 60% or more of orders contain only one item, in-session expansion has room to grow.","Check whether your current recommendation logic pulls from the full customer profile or from product-level rules alone. That distinction determines real relevance.","Map what happens to a cross-sell recommendation after a shopper leaves without adding the item. If the answer is nothing, the in-session miss becomes a permanent one."],leak1Play:"Order Value Expansion",leak1PlayDesc:"<p>Order Value Expansion pulls the full customer profile into every recommendation, then surfaces the most relevant add-on or bundle during the session. Recommendations update in real time as the shopper moves through it.</p><p>When a shopper leaves without adding the recommended item, follow-up carries the same intelligence into email or push. No separate rule set. No starting over.</p>",leak2Title:"Repeat purchase timing may be working against customer retention",leak2Body:"<p>The first purchase happened. That's the hard part. The gap is what comes next. For products with a natural consumption cycle, the repeat purchase is predictable, but only if the timing is right. A fixed 30-day reminder doesn't account for the customer who uses a product in three weeks or the one who stocks up and won't need it for two months.</p><p>When the reminder arrives at the wrong moment, it gets ignored. And some of those customers have already reordered somewhere else.</p>",leak2CostBullets:["Across commerce, average repeat purchase rates range from 15-30%, meaning most brands lose 70-85% of customers after the first order.","For products purchased 3-4 times per year, missed replenishment timing compounds to $1.1M-$1.5M in annual lost revenue for every 7,500 customers who don't get the right prompt at the right moment."],leak2Actions:["Pull your repeat purchase rate for your top product categories. If it's below 25%, replenishment timing is likely a contributing factor.","Check the average time between first and second purchase for your highest-LTV customers versus customers who never bought again. The gap between those two numbers shows how much timing variance exists in your current base.","Map how your current replenishment reminders are triggered. If the answer is a fixed post-purchase delay, timing is based on a product average."],leak2Play:"Smart Replenishment & Upselling",leak2PlayDesc:"<p>Smart Replenishment & Upselling predicts each customer's individual reorder window from their actual purchase cadence. When a customer approaches their window, the play triggers through whatever channel they're most responsive to with the right message: a simple reminder, a subscription offer, an upgrade, or a bundle.</p><p>If a product is out of stock, the reminder suppresses and routes to an alternative instead. Timing predictions improve with every replenishment cycle.</p>"}
};

function getPatternKey(r){
  if(!r||r.length!==5)return null;
  const ans=r.split('').map(n=>parseInt(n)-1);
  if(ans.some(n=>isNaN(n)))return null;
  const q1=ans[0],q2=ans[1],q3=ans[2];
  if(q3===0)return'P12';
  if(q1===2)return'P07';
  if(q1===3)return'P08';
  if(q1===0){if(q2===0)return'P01';if(q2===1)return'P02';if(q2===2)return'P03';if(q2===3)return'P04';}
  if(q1===1){if(q2===0)return'P05';if(q2===1)return'P06';if(q2===2)return'P03';if(q2===3)return'P04';}
  if(q1===4){if(q2===0)return'P09';if(q2===1)return'P10';if(q2===2)return'P11';if(q2===3)return'P10';}
  return'P01';
}

function mkDots(isTop,count){
  const W=780,H=90,dots=[];
  const p0=[0,isTop?72:18],cp1=[W*.2,isTop?52:8],cp2=[W*.62,isTop?78:28],p3=[W,isTop?62:12];
  function bpt(t){const mt=1-t,mt2=mt*mt,mt3=mt2*mt,t2=t*t,t3=t2*t;return{x:mt3*p0[0]+3*mt2*t*cp1[0]+3*mt*t2*cp2[0]+t3*p3[0],y:mt3*p0[1]+3*mt2*t*cp1[1]+3*mt*t2*cp2[1]+t3*p3[1]};}
  function btan(t){const mt=1-t;const dx=3*(mt*mt*(cp1[0]-p0[0])+2*mt*t*(cp2[0]-cp1[0])+t*t*(p3[0]-cp2[0]));const dy=3*(mt*mt*(cp1[1]-p0[1])+2*mt*t*(cp2[1]-cp1[1])+t*t*(p3[1]-cp2[1]));const len=Math.sqrt(dx*dx+dy*dy)||1;return{tx:dx/len,ty:dy/len};}
  for(let i=0;i<count;i++){
    let t;if(Math.random()<.44){t=Math.random()<.5?Math.random()*.22:.78+Math.random()*.22;}else{t=.18+Math.random()*.64;}
    const iO=t<.25||t>.75;const sm=iO?42:26;const no=(Math.random()-.5)*2*sm;
    const pt=bpt(t);const{tx,ty}=btan(t);const nx=-ty,ny=tx;
    const x=pt.x+nx*no,y=pt.y+ny*no;
    if(x<-4||x>W+4||y<-4||y>H+4)continue;
    const r=iO?.9+Math.random()*1.6:.6+Math.random()*1.1;
    const alpha=iO?.38+Math.random()*.36:.18+Math.random()*.22;
    let col;if(t<.14)col='#FF68E9';else if(t<.28)col='#FF9F45';else if(t<.42)col='#FFE04B';else if(t<.58)col='#0CC2FF';else if(t<.74)col='#38BDF8';else col='#8C78FF';
    dots.push(`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="${col}" opacity="${alpha.toFixed(2)}"/>`);
  }
  return dots.join('');
}

function renderReport(p){
  const date=new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
  const td=mkDots(true,300),bd=mkDots(false,260);

  function costItems(bullets,color){
    return bullets.map(b=>`<li class="cost-item"><span style="position:absolute;left:0;top:6px;width:5px;height:5px;border-radius:50%;background:${color};display:block;"></span>${b}</li>`).join('');
  }
  function actionRows(actions,color){
    return actions.map((a,i)=>`<div class="action-row"><div class="action-num" style="background:${color};">${i+1}</div><div class="action-text">${a}</div></div>`).join('');
  }
  function leakCard(num,title,body,bullets,actions,play,playDesc,grad,color,bg){
    return`<div class="leak-card" style="background:${bg};">
<div class="leak-card-bar" style="background:${grad};"></div>
<div class="leak-num" style="color:${color};">${num}</div>
<div class="leak-title">${title}</div>
<div class="leak-body">${body}</div>
<div class="cost-box" style="background:${color}0d;border:1px solid ${color}33;">
<div class="cost-label" style="color:${color};">The cost</div>
<ul class="cost-list">${costItems(bullets,color)}</ul>
</div>
<div class="actions-label">Three things to do this week</div>
${actionRows(actions,color)}
<div class="play-box" style="background:${color}0a;border:1px solid ${color}22;">
<div class="play-label" style="color:${color};">The BlueConic Growth Play that closes your leak</div>
<div class="play-title">${play}</div>
<div class="play-desc">${playDesc}</div>
</div>
</div>`;
  }

  document.getElementById('wrap').innerHTML=`
<div class="report-header">
  <svg viewBox="0 0 780 90" xmlns="http://www.w3.org/2000/svg">${td}</svg>
  <div class="header-logo">blueconic</div>
  <div class="header-meta">Acquisition Pressure Test<br>${date}</div>
</div>
<div class="report-hero">
  <div class="hero-label"><span></span>Your acquisition diagnosis</div>
  <h1 class="hero-h1">Two leaks found.<br><em>Here's what they're costing you.</em></h1>
  <p class="hero-p">Based on your answers, we identified two leaks in your acquisition setup. This report names both, explains what each is costing you, and shows exactly how to fix them.</p>
  <div class="hero-date">Generated ${date}</div>
</div>
<div class="leaks-section">
  <div class="section-label">Your acquisition leaks</div>
  ${leakCard('Leak 01',p.leak1Title,p.leak1Body,p.leak1CostBullets,p.leak1Actions,p.leak1Play,p.leak1PlayDesc,'linear-gradient(90deg,#015FFF,#0CC2FF,#7FE7C1)','#015FFF','linear-gradient(135deg,rgba(1,95,255,0.04) 0%,rgba(12,194,255,0.03) 100%)')}
  ${leakCard('Leak 02',p.leak2Title,p.leak2Body,p.leak2CostBullets,p.leak2Actions,p.leak2Play,p.leak2PlayDesc,'linear-gradient(90deg,#8C78FF,#FF68E9,#FF9F45)','#8C78FF','linear-gradient(135deg,rgba(140,120,255,0.05) 0%,rgba(255,104,233,0.03) 100%)')}
</div>
<div class="sprint-section">
  <div class="sprint-bar"></div>
  <div class="sprint-label">Next step</div>
  <div class="sprint-h2">Start with one sprint.</div>
  <p class="sprint-p">Run one Growth Play over 90 days, focused on a single leak in your funnel, built around your actual customer data. You'll work alongside a Forward Deployed Builder (yes, a real human!), designing and executing the play with you from start to finish with a clear, actionable metric at the end. No handoffs. No black box. Just a result you can evaluate and scale.</p>
  <a class="sprint-btn" href="https://www.blueconic.com/request-demo">Talk to our team →</a>
  <div class="sprint-stats">
    <div class="stat"><div class="stat-val">90 days</div><div class="stat-label">Duration</div></div>
    <div class="stat stat-mid"><div class="stat-val">1 Growth Play</div><div class="stat-label">Scope</div></div>
    <div class="stat"><div class="stat-val">$5k</div><div class="stat-label">Investment</div></div>
  </div>
</div>
<div class="report-footer">
  <svg viewBox="0 0 780 90" xmlns="http://www.w3.org/2000/svg">${bd}</svg>
  <div class="footer-url">blueconic.com</div>
  <div class="footer-actions">
    <button class="save-btn" onclick="window.print()">Save as PDF ↓</button>
  </div>
</div>`;
}

const r=new URLSearchParams(window.location.search).get('r');
const key=getPatternKey(r);
if(key&&patterns[key]){
  renderReport(patterns[key]);
}else{
  document.getElementById('wrap').innerHTML=`<div class="error-state"><h2>Report not found</h2><p>This link may be invalid or expired. <a href="/" style="color:#015FFF;">Take the quiz again →</a></p></div>`;
}
